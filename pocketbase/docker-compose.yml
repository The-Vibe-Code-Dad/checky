services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PB_VERSION: ${PB_VERSION:-0.41.1}
    container_name: checky-pocketbase
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POCKETBASE_PORT:-8090}:8080"
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - pocketbase_data:/pb/pb_data

volumes:
  pocketbase_data:
