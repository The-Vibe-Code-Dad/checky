name: Publish Docker images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Security, sync, and container checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate installation files
        run: |
          docker compose -f checkys-base/docker-compose.yml config --quiet
          docker compose -f checkys-base/docker-compose.casaos.yml config --quiet
          node --test checkys-app/test/security.test.cjs
          node --test checkys-base/test/desktop-release.test.cjs
          node --test checkys-base/test/pwa.test.cjs
          npm ci --prefix checkys-base/pocketbase/push --ignore-scripts --no-audit --no-fund
          node --test checkys-base/test/reminders.test.cjs
      - name: Test fresh backend and real Base/desktop sync
        shell: pwsh
        run: ./checkys-base/test/test-security.ps1
      - name: Test reminder scheduling and persistent public-origin config
        run: |
          docker create --name checky-reminder-binary checky-security-regression:local
          docker cp checky-reminder-binary:/pb/pocketbase "$RUNNER_TEMP/checky-pocketbase"
          docker rm checky-reminder-binary
          chmod +x "$RUNNER_TEMP/checky-pocketbase"
          CHECKY_POCKETBASE_BINARY="$RUNNER_TEMP/checky-pocketbase" node checkys-base/test/reminders-integration.cjs
      - name: Test installed-app updates in Chromium
        # Exercise real service-worker replacement before publishing either image variant.
        run: |
          npm install --prefix "$RUNNER_TEMP/checky-browser" --no-save --ignore-scripts --no-audit --no-fund playwright@1.64.1
          node "$RUNNER_TEMP/checky-browser/node_modules/playwright/cli.js" install --with-deps chromium
          CHECKY_PLAYWRIGHT_MODULE="$RUNNER_TEMP/checky-browser/node_modules/playwright" CHECKY_POCKETBASE_BINARY="$RUNNER_TEMP/checky-pocketbase" node checkys-base/test/pwa-browser.cjs
      - name: Validate web image and generated app version
        run: |
          docker build -t checky-web-regression -f checkys-base/web.Dockerfile checkys-base
          docker run --rm checky-web-regression caddy validate --config /etc/caddy/Caddyfile
      - name: Test CasaOS first-user setup through the web entrypoint
        run: node checkys-base/test/casaos-stack.cjs
      - name: Build and test Base with the verified Windows app
        run: |
          node checkys-base/scripts/download-desktop-release.cjs
          docker build -t checky-web-with-app-regression --build-arg BASE_WEB_IMAGE=checky-web-regression:latest -f checkys-base/web-with-app.Dockerfile checkys-base/.desktop-release
          CHECKY_TEST_WEB_IMAGE=checky-web-with-app-regression:latest CHECKY_TEST_WITH_APP=true node checkys-base/test/casaos-stack.cjs

  publish:
    name: Publish AMD64 and ARM64 images
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'The-Vibe-Code-Dad/checky'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/the-vibe-code-dad/checky
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Download and verify the pinned desktop release
        run: node checkys-base/scripts/download-desktop-release.cjs
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./checkys-base
          file: ./checkys-base/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Checky's List web
          cache-from: type=gha,scope=checky-web
          cache-to: type=gha,mode=max,scope=checky-web
      - name: Build and push PocketBase image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./checkys-base/pocketbase
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-pocketbase:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Checky's List PocketBase
          cache-from: type=gha,scope=checky-pocketbase
          cache-to: type=gha,mode=max,scope=checky-pocketbase
      - name: Build and push Base with the Windows app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./checkys-base/.desktop-release
          file: ./checkys-base/web-with-app.Dockerfile
          build-args: BASE_WEB_IMAGE=${{ env.IMAGE_PREFIX }}-web:sha-${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:sha-${{ github.sha }}-wapp
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Checky's List Base with Windows app
          cache-from: type=gha,scope=checky-web-wapp
          cache-to: type=gha,mode=max,scope=checky-web-wapp
      - name: Promote the completed images to latest and latestwapp
        run: |
          for component in web pocketbase; do
            docker buildx imagetools create \
              --tag "${IMAGE_PREFIX}-${component}:latest" \
              "${IMAGE_PREFIX}-${component}:sha-${GITHUB_SHA}"
            echo "- \`${IMAGE_PREFIX}-${component}:sha-${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          done
          docker buildx imagetools create \
            --tag "${IMAGE_PREFIX}-web:latestwapp" \
            "${IMAGE_PREFIX}-web:sha-${GITHUB_SHA}-wapp"
          echo "- \`${IMAGE_PREFIX}-web:latestwapp\` includes the verified Windows installer and signed manifest." >> "$GITHUB_STEP_SUMMARY"
          echo 'CasaOS installer: [docker-compose.casaos.yml](https://raw.githubusercontent.com/The-Vibe-Code-Dad/checky/main/checkys-base/docker-compose.casaos.yml)' >> "$GITHUB_STEP_SUMMARY"
