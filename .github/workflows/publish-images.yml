name: Publish Docker images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Security, sync, and container checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate installation files
        run: |
          docker compose -f checkys-base/docker-compose.yml config --quiet
          docker compose -f checkys-base/docker-compose.casaos.yml config --quiet
          node --test checkys-app/test/security.test.cjs
      - name: Test fresh backend and real Base/desktop sync
        shell: pwsh
        run: ./checkys-base/test/test-security.ps1
      - name: Validate web image
        run: |
          docker build -t checky-web-regression -f checkys-base/web.Dockerfile checkys-base
          docker run --rm checky-web-regression caddy validate --config /etc/caddy/Caddyfile
      - name: Test CasaOS first-user setup through the web entrypoint
        run: node checkys-base/test/casaos-stack.cjs

  publish:
    name: Publish AMD64 and ARM64 images
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'The-Vibe-Code-Dad/checky'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/the-vibe-code-dad/checky
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./checkys-base
          file: ./checkys-base/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Checky's List web
          cache-from: type=gha,scope=checky-web
          cache-to: type=gha,mode=max,scope=checky-web
      - name: Build and push PocketBase image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./checkys-base/pocketbase
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-pocketbase:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Checky's List PocketBase
          cache-from: type=gha,scope=checky-pocketbase
          cache-to: type=gha,mode=max,scope=checky-pocketbase
      - name: Promote the completed image pair to latest
        run: |
          for component in web pocketbase; do
            docker buildx imagetools create \
              --tag "${IMAGE_PREFIX}-${component}:latest" \
              "${IMAGE_PREFIX}-${component}:sha-${GITHUB_SHA}"
            echo "- \`${IMAGE_PREFIX}-${component}:sha-${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          done
          echo 'CasaOS installer: [docker-compose.casaos.yml](https://raw.githubusercontent.com/The-Vibe-Code-Dad/checky/main/checkys-base/docker-compose.casaos.yml)' >> "$GITHUB_STEP_SUMMARY"
